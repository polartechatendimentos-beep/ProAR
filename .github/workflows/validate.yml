name: Validar ProAR

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main, "release/proar-production-20260921", "feat/**", "fix/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: proar-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Quality gate
        run: npm run validate
      - name: Runtime smoke
        run: |
          npm start > /tmp/proar-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /tmp/proar-home.html; then break; fi
            sleep 1
          done
          grep -qi "ProAR" /tmp/proar-home.html
          curl -sS -o /tmp/auth.json -w "%{http_code}" http://127.0.0.1:3000/api/auth | grep -Eq "^(200|401|403)$"
