name: Validar ProAR

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main, "release/proar-production-20260921", "feat/**", "fix/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: proar-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Domain and transaction tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Runtime smoke
        run: |
          npm start > /tmp/proar-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          READY=0
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/ > /tmp/proar-home.html; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = "1"
          grep -qi "ProAR" /tmp/proar-home.html
          curl -fsS http://127.0.0.1:3000/api/health > /tmp/proar-health.json
          node -e 'const h=JSON.parse(require("fs").readFileSync("/tmp/proar-health.json","utf8")); if(h.ok!==true||h.service!=="ProAR") process.exit(1)'
          STATUS=$(curl -sS -o /tmp/auth.json -w "%{http_code}" http://127.0.0.1:3000/api/auth)
          echo "$STATUS" | grep -Eq "^(200|401|403)$"
          node -e 'JSON.parse(require("fs").readFileSync("/tmp/auth.json","utf8"))'

          POST_STATUS=$(curl -sS -D /tmp/auth-post.headers -o /tmp/auth-post.json -w "%{http_code}" \
            -X POST http://127.0.0.1:3000/api/auth \
            -H "Content-Type: application/json" \
            --data '{"username":"__proar_runtime_smoke_invalid__","password":"invalid-smoke-password","tenant":""}')
          echo "$POST_STATUS" | grep -Eq "^(401|403|500|503)$"
          grep -qi "^content-type: application/json" /tmp/auth-post.headers
          node -e 'const body=JSON.parse(require("fs").readFileSync("/tmp/auth-post.json","utf8")); if(!body || typeof body!=="object") process.exit(1); if(typeof body.error!=="string") process.exit(1)'
      - name: Upload runtime diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proar-validation-diagnostics-${{ github.run_id }}
          path: |
            /tmp/proar-next.log
            /tmp/proar-home.html
            /tmp/proar-health.json
            /tmp/auth.json
            /tmp/auth-post.json
            /tmp/auth-post.headers
          if-no-files-found: ignore
          retention-days: 7
