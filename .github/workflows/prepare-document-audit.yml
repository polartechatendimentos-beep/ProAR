name: Preparar dependências da auditoria documental
on:
  push:
    branches: ["feat/document-batch-audit-20261029"]
    paths: [".github/workflows/prepare-document-audit.yml"]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/document-batch-audit-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve reviewed exact dependencies without package scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund pdfjs-dist@6.4.299 tesseract.js@7.0.0
      - name: Save manifest and lockfile in development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: pin PDF.js and Tesseract for document extraction"
          git push origin HEAD:feat/document-batch-audit-20261029
