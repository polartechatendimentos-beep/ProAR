name: ProAR 3 Field validation
on:
  pull_request:
    paths:
      - 'lib/field/**'
      - 'components/TechnicalBasePanel.tsx'
      - 'app/api/technical-base/**'
      - 'app/api/technical-base/assistant/**'
      - 'app/page.tsx'
      - 'tests/proar3-field-foundations.test.mjs'
      - 'tests/technical-base-assistant.test.mjs'
      - 'tests/proar3-navigation.test.mjs'
      - '.github/workflows/proar3-field.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/proar3-field-foundations.test.mjs tests/technical-base-assistant.test.mjs tests/proar3-navigation.test.mjs
      - run: npm run typecheck
